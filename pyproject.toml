[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "kernel_extraction"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust"
]
requires-python = ">=3.7"
dependencies = ["numpy", "scipy>=1.6", "matplotlib", "tqdm"]
