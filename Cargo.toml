[package]
name = "kernel_extraction"
version = "0.1.0"
authors = ["Lucas Tepper <lucas.tepper.91@gmail.com>"]
edition = "2021"

[lib]
name = "kernel_extraction"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.16.2"
ndarray = { version = "0.15.4", features = ["approx"] }
packed_simd = { version = "0.3.8", package = "packed_simd_2" }
rayon = "1.5.3"
rustacuda = { version = "0.1", optional = true }
rustacuda_core = { version = "0.1", optional = true }
rustacuda_derive = { version = "0.1", optional = true }
cublas = { version = "0.2.0", optional = true }
cublas-sys = { version = "0.1.0", optional = true }
indicatif = "0.17.2"

[dependencies.pyo3]
version = "0.16.5"
features = ["extension-module"]

[features]
default = ["cuda"]
cuda = [
    "dep:rustacuda",
    "dep:rustacuda_core",
    "dep:rustacuda_derive",
    "dep:cublas",
    "dep:cublas-sys",
]
