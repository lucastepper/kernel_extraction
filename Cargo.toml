[package]
name = "kernel_extraction"
version = "0.1.1"
authors = ["Lucas Tepper <lucas.tepper.91@gmail.com>"]
edition = "2021"

[lib]
name = "kernel_extraction"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.16.2"
ndarray = { version = "0.15.4", features = ["approx"] }
rayon = "1.5.3"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "cublas", "nvrtc", "dynamic-loading", "cuda-12060"], optional = true }
indicatif = "0.17.2"

[dependencies.pyo3]
version = "0.16.5"
features = ["extension-module"]

[features]
default = ["cuda"]
cuda = ["dep:cudarc"]
